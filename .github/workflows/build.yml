name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FrameGrab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FrameGrab-apk
          path: FrameGrab.apk

      # ลิงก์ดาวน์โหลดถาวร: หน้า Releases > "FrameGrab ล่าสุด"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FrameGrab.apk \
            --title "FrameGrab ล่าสุด" \
            --notes "ดาวน์โหลด FrameGrab.apk ด้านล่าง แล้วเปิดในมือถือ Android เพื่อติดตั้ง (build ${{ github.run_number }})"
